AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Project VANGUARD — CloudFormation stack for EC2 sidecar deployment.
  Creates an ECS Cluster, ALB, and ECS Service running VANGUARD in front of
  your origin application.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the ECS cluster will run
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the ALB and ECS tasks
  VanguardImage:
    Type: String
    Description: ECR image URI for VANGUARD (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/vanguard:latest)
  OriginImage:
    Type: String
    Description: ECR image URI for your origin application
  OriginPort:
    Type: Number
    Default: 8000
    Description: Port your origin application listens on

Resources:
  # ─── ECS Cluster ──────────────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: vanguard-cluster

  # ─── IAM Roles ────────────────────────────────────────────────────────────
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vanguard-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vanguard-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # ─── Security Groups ──────────────────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS task security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # ─── ALB ──────────────────────────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: vanguard-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: vanguard-tg
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ─── ECS Task Definition ──────────────────────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vanguard-sidecar
      NetworkMode: awsvpc
      RequiresCompatibilities: [EC2]
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: vanguard
          Image: !Ref VanguardImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: ORIGIN_URL
              Value: !Sub "http://localhost:${OriginPort}"
            - Name: PROXY_PORT
              Value: "8080"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/vanguard
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
        - Name: origin-app
          Image: !Ref OriginImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref OriginPort
          DependsOn:
            - ContainerName: vanguard
              Condition: HEALTHY

  # ─── ECS Service ──────────────────────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: vanguard-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 2
      LaunchType: EC2
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: vanguard
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ALBEndpoint:
    Description: Public endpoint of the VANGUARD-protected service
    Value: !GetAtt ALB.DNSName
