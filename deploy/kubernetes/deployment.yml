# Project VANGUARD — Kubernetes Deployment
# Deploys VANGUARD as a DaemonSet-style sidecar or a standalone Deployment.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard
  namespace: default
  labels:
    app: vanguard
    version: "0.1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vanguard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vanguard
        version: "0.1.0"
    spec:
      # Run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: vanguard
          image: vanguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ORIGIN_URL
              valueFrom:
                configMapKeyRef:
                  name: vanguard-config
                  key: ORIGIN_URL
            - name: PROXY_PORT
              value: "8080"
            - name: ENTROPY_BENIGN_THRESHOLD
              value: "0.45"
            - name: ENTROPY_BLOCK_CONFIDENCE
              value: "0.85"
            - name: DOJO_PAYLOADS_PER_MINUTE
              value: "1000"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

      # Spread replicas across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vanguard

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanguard-config
  namespace: default
data:
  ORIGIN_URL: "http://origin-service:8000"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vanguard-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vanguard
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
