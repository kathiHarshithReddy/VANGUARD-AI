# Project VANGUARD — Kubernetes Service
# Exposes VANGUARD via a LoadBalancer service (or use an Ingress in production).

apiVersion: v1
kind: Service
metadata:
  name: vanguard
  namespace: default
  labels:
    app: vanguard
  annotations:
    # AWS: Use NLB for ultra-low latency
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # GCP: Use a global load balancer
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer
  selector:
    app: vanguard
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  sessionAffinity: None

---
# Optional: ClusterIP service for internal mesh communication
apiVersion: v1
kind: Service
metadata:
  name: vanguard-internal
  namespace: default
  labels:
    app: vanguard
spec:
  type: ClusterIP
  selector:
    app: vanguard
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
