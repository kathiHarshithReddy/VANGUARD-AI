# ─── Deploy to GCP Cloud Run ──────────────────────────────────────────────────
#
# Triggered on push to main after CI passes.
#
# What it does:
#   1. Authenticate with Google Cloud via Workload Identity Federation (keyless)
#   2. Build & push image to Google Artifact Registry
#   3. Deploy (or update) the Cloud Run service
#
# Required secrets / variables (Settings → Secrets → Actions):
#   GCP_PROJECT_ID              e.g. my-project-123456
#   GCP_REGION                  e.g. us-central1
#   GCP_WORKLOAD_IDENTITY_PROVIDER  WIF provider resource name
#       e.g. projects/123/locations/global/workloadIdentityPools/github/providers/github
#   GCP_SERVICE_ACCOUNT         SA email used for deployment
#       e.g. vanguard-deployer@my-project-123456.iam.gserviceaccount.com
#   GCP_ARTIFACT_REGISTRY       Artifact Registry host
#       e.g. us-central1-docker.pkg.dev
#   GCP_AR_REPOSITORY           Repository name in Artifact Registry  (e.g. vanguard)
#   ORIGIN_URL                  Your origin server URL passed to the container
#
# Alternative (key-based auth — simpler but less secure):
#   Set GCP_SA_KEY to the JSON key of a service account with
#   roles/run.admin + roles/artifactregistry.writer, then replace the
#   google-github-actions/auth step with:
#       credentials_json: ${{ secrets.GCP_SA_KEY }}

name: Deploy → GCP

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy-gcp:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: gcp-production
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate with GCP via WIF ─────────────────────────────────────
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Build & push to Artifact Registry ────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_ARTIFACT_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/vanguard:latest
            ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/vanguard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Cloud Run ───────────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vanguard
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/vanguard:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --min-instances=1
            --max-instances=100
            --concurrency=500
            --cpu=2
            --memory=1Gi
            --timeout=30s
          env_vars: |
            ORIGIN_URL=${{ secrets.ORIGIN_URL }}
            PROXY_PORT=8080
            ENTROPY_BENIGN_THRESHOLD=0.45
            ENTROPY_BLOCK_CONFIDENCE=0.85
            DOJO_PAYLOADS_PER_MINUTE=1000

      - name: Deployment summary
        run: |
          echo "✅ VANGUARD deployed to GCP Cloud Run"
          echo "   URL   : ${{ steps.deploy.outputs.url }}"
          echo "   Image : ${{ github.sha }}"
          echo "   Region: ${{ secrets.GCP_REGION }}"
