# ─── CI — Test & Build ───────────────────────────────────────────────────────
#
# Runs on every push and pull-request to every branch.
# Steps:
#   1. Lint (flake8)
#   2. Unit tests with coverage
#   3. Docker build + smoke-test
#   4. Push image to GHCR (on pushes to main only)
#
# Required secrets (set in repo Settings → Secrets & Variables → Actions):
#   GHCR_TOKEN   — GitHub Personal Access Token with packages:write scope
#                  (or leave empty — GITHUB_TOKEN works for GHCR on public repos)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vanguard

jobs:
  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install flake8 flake8-bugbear

      - name: Run flake8
        run: |
          flake8 vanguard/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,.git

  # ── 2. Unit tests ───────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=vanguard --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  # ── 3. Docker build + smoke-test ────────────────────────────────────────────
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: vanguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke-test — container starts and /healthz returns 200
        run: |
          # Start container without an origin (healthz doesn't need it)
          docker run -d --name vanguard-smoke \
            -p 8080:8080 \
            -e ORIGIN_URL=http://localhost:9999 \
            vanguard:ci

          # Wait up to 30s for the proxy to become ready
          timeout 30 bash -c '
            until curl -sf http://localhost:8080/healthz; do
              echo "Waiting for VANGUARD..."
              sleep 2
            done
          '

          # Verify response body
          curl -sf http://localhost:8080/healthz | grep -q '"status": *"ok"'
          echo "✅ Smoke test passed"

          docker stop vanguard-smoke

  # ── 4. Push to GHCR (main branch only) ─────────────────────────────────────
  push-image:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
