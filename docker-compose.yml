version: "3.9"

services:
  vanguard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: vanguard:latest
    container_name: vanguard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ORIGIN_URL: "http://origin:8000"
      PROXY_HOST: "0.0.0.0"
      PROXY_PORT: "8080"
      ENTROPY_BENIGN_THRESHOLD: "0.45"
      ENTROPY_BLOCK_CONFIDENCE: "0.85"
      DOJO_PAYLOADS_PER_MINUTE: "1000"
      VANGUARD_DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vanguard-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # Stub origin server for local development
  origin:
    image: nginx:alpine
    container_name: origin
    networks:
      - vanguard-net

networks:
  vanguard-net:
    driver: bridge
